services:
  - type: web
    name: delmon-website
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --prod=false && PORT=5173 BASE_PATH=/ pnpm --filter @workspace/delmon-website run build
    staticPublishPath: artifacts/delmon-website/dist/public
    domains:
      - www.delmon-bh.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
